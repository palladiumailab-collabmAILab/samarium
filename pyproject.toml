[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samarium"
version = "0.1.0"
description = "Persona LLM pipeline from user-owned X archives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
samarium = "samarium.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/samarium"]
